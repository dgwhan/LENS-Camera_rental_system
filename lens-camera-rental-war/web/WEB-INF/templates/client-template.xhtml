<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets">
    <h:head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title><ui:insert name="title">Lens Camera Rental - Premium Camera &amp; Lens Equipment</ui:insert></title>
        <h:outputStylesheet library="shared" name="css/color.css" />
        <h:outputStylesheet library="shared" name="css/font.css" />
        <h:outputStylesheet library="shared" name="css/app.css" />
        <ui:insert name="head" />
    </h:head>
    <h:body styleClass="#{not empty bodyClass ? bodyClass : ''}">
        <!-- Global Feedback & Alert Messages (localhost say alert) -->
        <h:panelGroup id="globalAlertsPanel" rendered="#{not empty flash.actionAlert or not empty facesContext.messageList}" layout="block" style="display:none;">
            <h:outputText value="#{flash.actionAlert}" styleClass="app-alert-msg" rendered="#{not empty flash.actionAlert}" />
            <ui:repeat value="#{facesContext.messageList}" var="m">
                <span class="app-alert-msg">#{m.summary}</span>
            </ui:repeat>
            <script type="text/javascript">
                (function() {
                    var els = document.querySelectorAll('.app-alert-msg');
                    var msgs = [];
                    els.forEach(function(el) {
                        var text = (el.textContent || '').trim();
                        if (text) {
                            msgs.push(text);
                        }
                    });
                    var unique = Array.from(new Set(msgs));
                    if (unique.length &gt; 0) {
                        var alertText = unique.join('\n');
                        if (window._lastAlertShown !== alertText) {
                            window._lastAlertShown = alertText;
                            alert(alertText);
                        }
                    }
                })();
            </script>
        </h:panelGroup>

        <!-- Common Client Header -->
        <ui:insert name="header">
            <ui:include src="/client/components/header.xhtml" />
        </ui:insert>

        <!-- Main Content Area -->
        <ui:insert name="content" />

        <!-- Common Client Footer -->
        <ui:insert name="footer">
            <ui:include src="/client/components/footer.xhtml" />
        </ui:insert>

        <!-- Scripts placeholder -->
        <ui:insert name="scripts" />
    </h:body>
</html>
