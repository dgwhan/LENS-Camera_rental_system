<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets">
    <h:head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title><ui:insert name="title">Lens Camera Rental - Admin</ui:insert></title>
        <h:outputStylesheet library="shared" name="css/color.css" />
        <h:outputStylesheet library="shared" name="css/font.css" />
        <h:outputStylesheet library="admin" name="css/app.css" />
        <h:outputStylesheet library="shared" name="css/components/buttons.css" />
        <h:outputStylesheet library="shared" name="css/components/badges.css" />
        <h:outputStylesheet library="admin" name="css/components/table.css" />
        <h:outputStylesheet library="admin" name="css/components/selector.css" />
        <h:outputStylesheet library="admin" name="css/components/sidebar.css" />
        <ui:insert name="head" />
    </h:head>
    <h:body>
        <!-- Global Feedback & Alert Messages (localhost say alert) -->
        <h:panelGroup id="globalAdminAlertsPanel" rendered="#{not empty flash.actionAlert or not empty facesContext.messageList}" layout="block" style="display:none;">
            <h:outputText value="#{flash.actionAlert}" styleClass="admin-alert-msg" rendered="#{not empty flash.actionAlert}" />
            <ui:repeat value="#{facesContext.messageList}" var="m">
                <span class="admin-alert-msg">#{m.summary}</span>
            </ui:repeat>
            <script type="text/javascript">
                (function() {
                    var els = document.querySelectorAll('.admin-alert-msg');
                    var msgs = [];
                    els.forEach(function(el) {
                        var text = (el.textContent || '').trim();
                        if (text) {
                            msgs.push(text);
                        }
                    });
                    var unique = Array.from(new Set(msgs));
                    if (unique.length &gt; 0) {
                        var alertText = unique.join('\n');
                        if (window._lastAdminAlertShown !== alertText) {
                            window._lastAdminAlertShown = alertText;
                            alert(alertText);
                        }
                    }
                })();
            </script>
        </h:panelGroup>

        <div class="app-container">
            <ui:include src="/admin/sidebar.xhtml">
                <ui:param name="activeMenu" value="#{activeMenu}" />
            </ui:include>

            <main class="app-content">
                <ui:insert name="content" />
            </main>
        </div>

        <ui:insert name="scripts" />
    </h:body>
</html>
