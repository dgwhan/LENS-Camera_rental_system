<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets">
    <h:head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title><ui:insert name="title">Lens Camera Rental - Admin</ui:insert></title>
        <h:outputStylesheet library="shared" name="css/color.css" />
        <h:outputStylesheet library="shared" name="css/font.css" />
        <h:outputStylesheet library="shared" name="css/app.css" />
        <h:outputStylesheet library="shared" name="css/components/buttons.css" />
        <h:outputStylesheet library="shared" name="css/components/badges.css" />
        <h:outputStylesheet library="admin" name="css/components/table.css" />
        <h:outputStylesheet library="admin" name="css/components/selector.css" />
        <h:outputStylesheet library="admin" name="css/components/sidebar.css" />
        <ui:insert name="head" />
    </h:head>
    <h:body>
        <!-- Flash Alert Message if any -->
        <h:panelGroup rendered="#{not empty flash.actionAlert}">
            <script type="text/javascript">
                alert('#{flash.actionAlert}');
            </script>
        </h:panelGroup>

        <div class="app-container">
            <ui:include src="/admin/sidebar.xhtml">
                <ui:param name="activeMenu" value="#{activeMenu}" />
            </ui:include>

            <main class="app-content">
                <ui:insert name="content" />
            </main>
        </div>

        <ui:insert name="scripts" />
    </h:body>
</html>
