<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets">

    <!-- Auto-include Rental Period & DatePicker Resources (100% Identical with Device Detail) -->
    <h:outputStylesheet library="client" name="css/components/rental-period.css" />
    <h:outputStylesheet library="client" name="css/components/datepicker.css" />
    <h:outputScript library="js" name="common/datepicker.js" />

    <div class="rental-period-section custom-datepicker-wrapper" id="#{not empty id ? id : 'rentalPeriodWrapper'}"
         data-initial-start="#{startValue}"
         data-initial-end="#{endValue}"
         data-cart-item-id="#{cartItemId}">

        <!-- Header Row: RENTAL PERIOD and DURATION -->
        <div class="rental-period-header">
            <h3 class="rental-period-title">RENTAL PERIOD</h3>
            <div class="rental-header-actions">
                <span class="rental-period-duration" data-role="duration-display">DURATION: --</span>
            </div>
        </div>

        <!-- Dual Date Inputs Row: Start Date & End Date -->
        <div class="rental-dates-grid">
            <!-- Start Date Column -->
            <div class="rental-date-field">
                <label class="rental-date-label">START DATE</label>
                <div class="rental-date-box" data-role="start-box" tabindex="0" role="button"
                    aria-label="Select start date">
                    <span class="rental-date-text" data-role="start-text">#{not empty startValue ? startValue : 'dd / mm / yyyy'}</span>
                </div>
            </div>

            <!-- End Date Column -->
            <div class="rental-date-field">
                <label class="rental-date-label">END DATE</label>
                <div class="rental-date-box" data-role="end-box" tabindex="0" role="button"
                    aria-label="Select end date">
                    <span class="rental-date-text" data-role="end-text">#{not empty endValue ? endValue : 'dd / mm / yyyy'}</span>
                </div>
            </div>

            <!-- Dropdown Calendar Popup (Exact Device Detail component) -->
            <div class="rental-calendar-popup" data-role="calendar-popup" aria-hidden="true">
                <div class="calendar-popup-header">
                    <button type="button" class="calendar-nav-btn" data-role="prev-month"
                        aria-label="Previous month">&#8249;</button>
                    <span class="calendar-month-title" data-role="month-title">October 2026</span>
                    <button type="button" class="calendar-nav-btn" data-role="next-month"
                        aria-label="Next month">&#8250;</button>
                </div>

                <div class="calendar-step-hint" data-role="step-hint">
                    Select start date (at least 1 day in advance)
                </div>

                <table class="calendar-table">
                    <thead>
                        <tr>
                            <th>Su</th>
                            <th>Mo</th>
                            <th>Tu</th>
                            <th>We</th>
                            <th>Th</th>
                            <th>Fr</th>
                            <th>Sa</th>
                        </tr>
                    </thead>
                    <tbody data-role="calendar-days">
                        <!-- Dynamically populated by datepicker.js -->
                    </tbody>
                </table>

                <div class="calendar-popup-footer">
                    <span class="calendar-footer-hint">Rental calculated in 24h rolling increments</span>
                    <button type="button" class="calendar-reset-btn" data-role="reset-dates">Reset</button>
                </div>
            </div>
        </div>

        <!-- Action buttons row: CANCEL & APPLY DATES -->
        <div class="datepicker-actions-row">
            <button type="button" class="btn datepicker-cancel-btn" data-role="cancel-btn">
                CANCEL
            </button>
            <button type="button" class="btn datepicker-apply-btn" data-role="apply-btn">
                #{not empty applyLabel ? applyLabel : 'APPLY DATES'}
            </button>
        </div>

        <!-- Hidden inputs for JSF Form binding -->
        <input type="hidden"
               id="#{not empty startDateId ? startDateId : 'startDateHidden'}"
               name="#{not empty startDateName ? startDateName : 'startDate'}"
               value="#{startValue}"
               data-role="start-hidden" />

        <input type="hidden"
               id="#{not empty endDateId ? endDateId : 'endDateHidden'}"
               name="#{not empty endDateName ? endDateName : 'endDate'}"
               value="#{endValue}"
               data-role="end-hidden" />

    </div>
</ui:composition>
