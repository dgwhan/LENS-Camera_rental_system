<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets">

    <!-- Auto-include Pagination Resources -->
    <h:outputStylesheet library="client" name="css/components/pagination.css" />
    <script type="text/javascript" src="#{request.contextPath}/resources/js/common/pagination.js?v=1.0"></script>

    <!-- Reusable Semantic Pagination Landmark -->
    <nav id="#{not empty id ? id : 'paginationNav'}"
         class="pagination-nav #{empty totalItems or totalItems le 0 ? 'is-hidden' : ''}"
         role="navigation"
         aria-label="Pagination"
         data-current-page="#{not empty currentPage ? currentPage : 1}"
         data-page-size="#{not empty pageSize and pageSize gt 0 ? pageSize : paginationConfig.pageSize}"
         data-total-items="#{not empty totalItems ? totalItems : 0}"
         data-item-label="#{not empty itemLabel ? itemLabel : 'devices'}"
         data-show-summary="#{showSummary ne false ? 'true' : 'false'}">

        <div class="pagination-container">
            <!-- Mobile Stack Top Header -->
            <div class="pagination-mobile-header" data-role="mobile-header">
                PAGE #{not empty currentPage ? currentPage : 1}
            </div>

            <!-- Result Summary -->
            <div class="pagination-summary" data-role="summary">
                Showing <span class="pagination-summary-strong">--</span> of <span class="pagination-summary-strong">#{not empty totalItems ? totalItems : 0}</span> #{not empty itemLabel ? itemLabel : 'devices'}
            </div>

            <!-- Pagination Controls Row  -->
            <ul class="pagination-controls" data-role="controls">
                <!-- Dynamically populated and calibrated by pagination.js -->
            </ul>
        </div>
    </nav>

</ui:composition>
