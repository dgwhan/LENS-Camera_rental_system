<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets">

    <!-- Auto-include DeviceFilter Resources -->
    <h:outputStylesheet library="css" name="components/device-filter.css" />
    <script type="text/javascript" src="#{request.contextPath}/resources/js/device-filter.js?v=1.0"></script>

    <!-- Reusable DeviceFilter Component Wrapper -->
    <div id="#{not empty id ? id : 'deviceFilter'}"
         class="device-filter-wrapper"
         data-search="#{not empty search ? search : ''}"
         data-type="#{not empty selectedType ? selectedType : ''}"
         data-brand="#{not empty selectedBrand ? selectedBrand : ''}"
         data-rate="#{not empty selectedPriceRange ? selectedPriceRange : ''}"
         data-filtered-count="#{not empty filteredCount ? filteredCount : 0}"
         data-total-count="#{not empty totalCount ? totalCount : 0}"
         data-on-filter-change="#{not empty onFilterChange ? onFilterChange : ''}">

        <div class="device-filter-container">
            <!-- 1. Desktop & Tablet Filter Controls Bar -->
            <div class="device-filter-bar">
                <!-- Search Devices Field -->
                <div class="device-filter-field field-search">
                    <label class="device-filter-label" for="#{not empty id ? id : 'deviceFilter'}_searchInput">
                        SEARCH DEVICES
                    </label>
                    <div class="device-filter-search-wrap" data-role="desktop-search-wrap">
                        <span class="device-filter-search-icon" aria-hidden="true"></span>
                        <input type="text"
                               id="#{not empty id ? id : 'deviceFilter'}_searchInput"
                               class="device-filter-input"
                               data-role="desktop-search"
                               placeholder="Search devices"
                               value="#{not empty search ? search : ''}"
                               autocomplete="off" />
                        <button type="button"
                                class="device-filter-search-clear"
                                data-role="desktop-search-clear"
                                aria-label="Clear search input">
                            &#10005;
                        </button>
                    </div>
                </div>

                <!-- Type Dropdown Field -->
                <div class="device-filter-field field-type">
                    <label class="device-filter-label" for="#{not empty id ? id : 'deviceFilter'}_typeSelect">
                        TYPE
                    </label>
                    <div class="device-filter-select-wrap">
                        <select id="#{not empty id ? id : 'deviceFilter'}_typeSelect"
                                class="device-filter-select"
                                data-role="desktop-type">
                            <option value="">All Types</option>
                            <ui:repeat value="#{types}" var="t">
                                <option value="#{t}">#{t}</option>
                            </ui:repeat>
                        </select>
                        <span class="device-filter-select-arrow" aria-hidden="true"></span>
                    </div>
                </div>

                <!-- Brand Dropdown Field -->
                <div class="device-filter-field field-brand">
                    <label class="device-filter-label" for="#{not empty id ? id : 'deviceFilter'}_brandSelect">
                        BRAND
                    </label>
                    <div class="device-filter-select-wrap">
                        <select id="#{not empty id ? id : 'deviceFilter'}_brandSelect"
                                class="device-filter-select"
                                data-role="desktop-brand">
                            <option value="">All Brands</option>
                            <ui:repeat value="#{brands}" var="b">
                                <option value="#{b}">#{b}</option>
                            </ui:repeat>
                        </select>
                        <span class="device-filter-select-arrow" aria-hidden="true"></span>
                    </div>
                </div>

                <!-- Rental Rate Dropdown Field -->
                <div class="device-filter-field field-rate">
                    <label class="device-filter-label" for="#{not empty id ? id : 'deviceFilter'}_rateSelect">
                        RENTAL RATE
                    </label>
                    <div class="device-filter-select-wrap">
                        <select id="#{not empty id ? id : 'deviceFilter'}_rateSelect"
                                class="device-filter-select"
                                data-role="desktop-rate">
                            <option value="">Any Price</option>
                            <option value="under_100">Under 100,000 VND / day</option>
                            <option value="100_300">100,000 &#8211; 300,000 VND / day</option>
                            <option value="300_500">300,000 &#8211; 500,000 VND / day</option>
                            <option value="over_500">Over 500,000 VND / day</option>
                        </select>
                        <span class="device-filter-select-arrow" aria-hidden="true"></span>
                    </div>
                </div>

                <!-- Reset Action (Visually subdued/disabled when pristine) -->
                <div class="device-filter-field field-reset">
                    <button type="button"
                            class="device-filter-reset-btn"
                            data-role="reset-btn"
                            disabled="disabled">
                        Reset
                    </button>
                </div>
            </div>

            <!-- 2. Mobile Compact View (~390px Viewport) -->
            <div class="device-filter-mobile-row">
                <div class="device-filter-search-wrap device-filter-mobile-search" data-role="mobile-search-wrap">
                    <span class="device-filter-search-icon" aria-hidden="true"></span>
                    <input type="text"
                           class="device-filter-input"
                           data-role="mobile-search"
                           placeholder="Search devices"
                           value="#{not empty search ? search : ''}"
                           autocomplete="off" />
                    <button type="button"
                            class="device-filter-search-clear"
                            data-role="mobile-search-clear"
                            aria-label="Clear search input">
                        &#10005;
                    </button>
                </div>
                <button type="button"
                        class="device-filter-mobile-trigger"
                        data-role="mobile-trigger">
                    Filters
                    <span class="mobile-filter-badge" data-role="mobile-badge">0</span>
                </button>
            </div>

            <!-- 3. Active Filters Tray (Visible only when filters are active) -->
            <div class="device-filter-active-tray" data-role="active-tray">
                <div class="device-filter-active-left">
                    <span class="device-filter-active-label">ACTIVE FILTERS:</span>
                    <div class="device-filter-chips" data-role="chips-container">
                        <!-- Dynamically populated chips e.g. [ Query: "Sony" × ] -->
                    </div>
                    <button type="button" class="device-filter-clear-all" data-role="clear-all">
                        Clear all
                    </button>
                </div>
                <div class="device-filter-matches" data-role="match-display">
                    Matches: <strong class="match-count-strong">#{not empty filteredCount ? filteredCount : 0}</strong> of <strong class="match-count-strong">#{not empty totalCount ? totalCount : 0}</strong> models
                </div>
            </div>
        </div>

        <!-- 4. Mobile Modal / Drawer Sheet -->
        <div class="device-filter-drawer-overlay" data-role="drawer-overlay" aria-hidden="true">
            <div class="device-filter-drawer" role="dialog" aria-modal="true" aria-label="Filter devices">
                <!-- Drawer Header -->
                <div class="drawer-header">
                    <h3 class="drawer-title">FILTERS</h3>
                    <button type="button" class="drawer-close-btn" data-role="drawer-close" aria-label="Close filters">
                        &#10005;
                    </button>
                </div>

                <!-- Drawer Body (Stacked Selects) -->
                <div class="drawer-body">
                    <!-- Type Field -->
                    <div class="device-filter-field">
                        <label class="device-filter-label">TYPE</label>
                        <div class="device-filter-select-wrap">
                            <select class="device-filter-select" data-role="drawer-type">
                                <option value="">All Types</option>
                                <ui:repeat value="#{types}" var="t">
                                    <option value="#{t}">#{t}</option>
                                </ui:repeat>
                            </select>
                            <span class="device-filter-select-arrow" aria-hidden="true"></span>
                        </div>
                    </div>

                    <!-- Brand Field -->
                    <div class="device-filter-field">
                        <label class="device-filter-label">BRAND</label>
                        <div class="device-filter-select-wrap">
                            <select class="device-filter-select" data-role="drawer-brand">
                                <option value="">All Brands</option>
                                <ui:repeat value="#{brands}" var="b">
                                    <option value="#{b}">#{b}</option>
                                </ui:repeat>
                            </select>
                            <span class="device-filter-select-arrow" aria-hidden="true"></span>
                        </div>
                    </div>

                    <!-- Rental Rate Field -->
                    <div class="device-filter-field">
                        <label class="device-filter-label">RENTAL RATE</label>
                        <div class="device-filter-select-wrap">
                            <select class="device-filter-select" data-role="drawer-rate">
                                <option value="">Any Price</option>
                                <option value="under_100">Under 100,000 VND / day</option>
                                <option value="100_300">100,000 &#8211; 300,000 VND / day</option>
                                <option value="300_500">300,000 &#8211; 500,000 VND / day</option>
                                <option value="over_500">Over 500,000 VND / day</option>
                            </select>
                            <span class="device-filter-select-arrow" aria-hidden="true"></span>
                        </div>
                    </div>
                </div>

                <!-- Drawer Footer -->
                <div class="drawer-footer">
                    <button type="button" class="drawer-reset-btn" data-role="drawer-reset">
                        Reset Filters
                    </button>
                    <button type="button" class="drawer-apply-btn" data-role="drawer-apply">
                        Apply
                    </button>
                </div>
            </div>
        </div>
    </div>

</ui:composition>
