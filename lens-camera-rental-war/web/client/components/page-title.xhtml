<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets">

    <!-- Auto-include PageTitle Stylesheet -->
    <h:outputStylesheet library="css" name="components/page-title.css" />

    <!-- Reusable Page Title / Section Header Component -->
    <div id="#{not empty id ? id : 'pageTitleHeader'}"
         class="page-title-header #{align eq 'center' ? 'is-center' : ''} #{not empty containerClass ? containerClass : ''}">
        
        <div class="page-title-text-group">
            <div class="page-title-row">
                <!-- Heading Level: h1 if asH1 is true, else h2 -->
                <ui:fragment rendered="#{asH1 eq 'true' or level eq 'h1'}">
                    <h1 class="page-title-heading">#{not empty title ? title : 'Featured Devices'}</h1>
                </ui:fragment>
                <ui:fragment rendered="#{empty asH1 or asH1 ne 'true' and level ne 'h1'}">
                    <h2 class="page-title-heading">#{not empty title ? title : 'Featured Devices'}</h2>
                </ui:fragment>

                <!-- Optional Badge -->
                <ui:fragment rendered="#{not empty badge}">
                    <span class="page-title-badge">#{badge}</span>
                </ui:fragment>
            </div>

            <!-- Optional Subtitle -->
            <ui:fragment rendered="#{not empty subtitle}">
                <p class="page-title-subtitle">#{subtitle}</p>
            </ui:fragment>
        </div>

        <!-- Optional Action Link (e.g. View All Devices ->) -->
        <ui:fragment rendered="#{not empty linkText and not empty linkUrl}">
            <a href="#{linkUrl}"
               target="#{not empty linkTarget ? linkTarget : '_self'}"
               class="page-title-link">
                <span>#{linkText}</span>
                <ui:fragment rendered="#{empty showArrow or showArrow ne 'false'}">
                    <span class="page-title-arrow" aria-hidden="true">&#8594;</span>
                </ui:fragment>
            </a>
        </ui:fragment>
    </div>

</ui:composition>
