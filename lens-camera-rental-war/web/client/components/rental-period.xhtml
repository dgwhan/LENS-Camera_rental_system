<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html" xmlns:ui="jakarta.faces.facelets">

    <!-- Auto-include Rental Period & DatePicker Resources -->
    <h:outputStylesheet library="css" name="components/rental-period.css" />
    <h:outputScript library="js" name="rental-period.js" />

    <div class="rental-period-section" id="#{not empty id ? id : 'rentalPeriodWrapper'}">
        <!-- Header Row: RENTAL PERIOD and DURATION -->
        <div class="rental-period-header">
            <h3 class="rental-period-title">RENTAL PERIOD</h3>
            <div class="rental-header-actions">
                <span class="rental-period-duration" data-role="duration-display">DURATION: --</span>
                <button type="button" class="rental-change-btn" data-role="unlock-btn"
                    title="Change rental dates">
                    Change
                </button>
            </div>
        </div>

        <!-- Dual Date Inputs Row: Start Date & End Date -->
        <div class="rental-dates-grid">
            <!-- Start Date Column -->
            <div class="rental-date-field">
                <label class="rental-date-label">START DATE</label>
                <div class="rental-date-box" data-role="start-box" tabindex="0" role="button"
                    aria-label="Select start date">
                    <span class="rental-date-text" data-role="start-text">dd / mm / yyyy</span>
                </div>
            </div>

            <!-- End Date Column -->
            <div class="rental-date-field">
                <label class="rental-date-label">END DATE</label>
                <div class="rental-date-box" data-role="end-box" tabindex="0" role="button"
                    aria-label="Select end date">
                    <span class="rental-date-text" data-role="end-text">dd / mm / yyyy</span>
                </div>
            </div>

            <!-- Dropdown Calendar Popup -->
            <div class="rental-calendar-popup" data-role="calendar-popup" aria-hidden="true">
                <div class="calendar-popup-header">
                    <button type="button" class="calendar-nav-btn" data-role="prev-month"
                        aria-label="Previous month">&#8249;</button>
                    <span class="calendar-month-title" data-role="month-title">October 2026</span>
                    <button type="button" class="calendar-nav-btn" data-role="next-month"
                        aria-label="Next month">&#8250;</button>
                </div>

                <div class="calendar-step-hint" data-role="step-hint">
                    Select start date
                </div>

                <table class="calendar-table">
                    <thead>
                        <tr>
                            <th>Su</th>
                            <th>Mo</th>
                            <th>Tu</th>
                            <th>We</th>
                            <th>Th</th>
                            <th>Fr</th>
                            <th>Sa</th>
                        </tr>
                    </thead>
                    <tbody data-role="calendar-days">
                        <!-- Dynamically populated by rental-period.js -->
                    </tbody>
                </table>

                <div class="calendar-popup-footer">
                    <span class="calendar-footer-hint">Rental calculated in 24h rolling increments</span>
                    <button type="button" class="calendar-reset-btn" data-role="reset-dates">Reset</button>
                </div>
            </div>
        </div>

        <!-- Hidden inputs for form binding -->
        <input type="hidden" id="rentalStartDate" name="startDate" data-role="start-hidden"
            value="#{deviceDetailController.startDate}" />
        <input type="hidden" id="rentalEndDate" name="endDate" data-role="end-hidden"
            value="#{deviceDetailController.endDate}" />
    </div>

</ui:composition>
