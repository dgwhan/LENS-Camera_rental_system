<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:pt="jakarta.faces.passthrough"
                xmlns:ui="jakarta.faces.facelets"
                template="/WEB-INF/templates/client-template.xhtml">

    <ui:param name="bodyClass" value="auth-page" />

    <ui:define name="title">Sign In - Lens Camera Rental</ui:define>

    <ui:define name="head">
        <h:outputStylesheet library="css" name="pages/auth.css" />
    </ui:define>

    <!-- Suppress header and footer for standalone auth page -->
    <ui:define name="header" />
    <ui:define name="footer" />

    <ui:define name="content">
        <div class="auth-container">

            <!-- Login Card -->
            <div class="auth-card">
                <div class="auth-card-header">
                    <h2 class="auth-card-title">Sign In</h2>
                </div>

                <div class="auth-card-body">
                    <!-- Global FacesMessages (E.g. Login failed: Incorrect username or password) -->
                    <h:messages globalOnly="true" 
                                styleClass="auth-messages-list" 
                                errorClass="auth-msg-error" 
                                infoClass="auth-msg-info" />

                    <!-- Login Form -->
                    <h:form id="loginForm" styleClass="auth-form">
                        <div class="auth-form-group">
                            <h:outputLabel for="username" value="Username" styleClass="auth-label">
                                <span class="auth-required">*</span>
                            </h:outputLabel>
                            <h:inputText id="username" 
                                         value="#{authController.username}" 
                                         required="true"
                                         requiredMessage="Please enter your username"
                                         styleClass="auth-input" 
                                         autocomplete="username" 
                                         pt:placeholder="Enter your username" />
                            <h:message for="username" styleClass="field-error" />
                        </div>

                        <div class="auth-form-group">
                            <h:outputLabel for="password" value="Password" styleClass="auth-label">
                                <span class="auth-required">*</span>
                            </h:outputLabel>
                            <h:inputSecret id="password" 
                                           value="#{authController.password}" 
                                           required="true"
                                           requiredMessage="Please enter your password"
                                           styleClass="auth-input" 
                                           autocomplete="current-password" 
                                           pt:placeholder="Enter your password" />
                            <h:message for="password" styleClass="field-error" />
                        </div>

                        <div class="auth-form-group auth-form-actions">
                            <h:commandButton value="Sign In" 
                                             action="#{authController.login}" 
                                             styleClass="btn-auth" />
                        </div>
                    </h:form>
                </div>

                <div class="auth-card-footer">
                    <span>Don't have an account?</span>
                    <h:link outcome="/client/pages/register" value="Create an account" styleClass="auth-link" />
                </div>
            </div>

        </div>
    </ui:define>

</ui:composition>
