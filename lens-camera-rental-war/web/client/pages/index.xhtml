<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                template="/WEB-INF/templates/client-template.xhtml">

    <ui:define name="title">Lens Camera Rental - Premium Camera &amp; Lens Equipment</ui:define>

    <ui:define name="head">
        <h:outputStylesheet library="client" name="css/pages/customer.css" />
        <h:outputStylesheet library="client" name="css/components/device-card.css" />
    </ui:define>

    <ui:define name="content">
        <!-- Featured Devices Section -->
        <section class="featured-devices-section">
            <div class="featured-devices-container">
                <!-- Section Header -->
                <ui:include src="/client/components/page-title.xhtml">
                    <ui:param name="title" value="Featured Devices" />
                    <ui:param name="subtitle" value="Explore our devices" />
                    <ui:param name="linkText" value="View All Devices" />
                    <ui:param name="linkUrl" value="#{request.contextPath}/faces/client/pages/devices.xhtml" />
                </ui:include>

                <!-- Dynamic Device Cards Grid (Reusing device-grid component) -->
                <ui:include src="/client/components/device-grid.xhtml">
                    <ui:param name="devices" value="#{homeController.featuredDevices}" />
                    <ui:param name="controller" value="#{homeController}" />
                </ui:include>
            </div>
        </section>
    </ui:define>

</ui:composition>
