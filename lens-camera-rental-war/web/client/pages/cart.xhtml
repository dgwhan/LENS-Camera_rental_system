<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                template="/WEB-INF/templates/client-template.xhtml">

    <f:metadata>
        <f:viewAction action="#{cartController.checkAuthentication()}" />
    </f:metadata>

    <ui:define name="title">Rental Cart - Lens Camera Rental</ui:define>

    <ui:define name="head">
        <h:outputStylesheet library="css" name="components/buttons.css" />
        <h:outputStylesheet library="css" name="components/badges.css" />
        <h:outputStylesheet library="css" name="components/rental-period.css" />
        <h:outputStylesheet library="css" name="components/datepicker.css" />
        <h:outputStylesheet library="css" name="pages/customer.css" />
        <h:outputStylesheet library="css" name="pages/cart.css" />
        <h:outputScript library="js" name="cart.js" />
    </ui:define>

    <ui:define name="content">
        <!-- Main Cart Page Content -->
        <main class="cart-page-main" role="main">

            <!-- Breadcrumb Navigation: HOME / CART -->
            <div class="cart-breadcrumb-wrap">
                <ui:include src="/client/components/breadcrumb.xhtml">
                    <ui:param name="link1Text" value="HOME" />
                    <ui:param name="link1Url" value="#{request.contextPath}/faces/client/pages/index.xhtml" />
                    <ui:param name="currentPage" value="CART" />
                </ui:include>
            </div>

            <!-- Page Title Section Header -->
            <div class="cart-title-wrap">
                <ui:include src="/client/components/page-title.xhtml">
                    <ui:param name="title" value="RENTAL CART" />
                    <ui:param name="asH1" value="true" />
                    <ui:param name="subtitle" value="Review your selected equipment, rental duration, and cost breakdown" />
                </ui:include>
            </div>

            <!-- Cart Main Form Wrapper for AJAX Updates -->
            <h:form id="cartForm" prependId="false">

                <!-- Global Feedback Messages -->
                <h:panelGroup id="cartMessagesWrapper" layout="block" styleClass="cart-messages-wrap">
                    <h:messages globalOnly="true"
                                styleClass="client-messages"
                                infoClass="client-alert client-alert-success"
                                errorClass="client-alert client-alert-danger" />
                </h:panelGroup>

                <!-- Container rendered dynamically based on cart state -->
                <h:panelGroup id="cartMainWrapper" layout="block">

                    <!-- ========================================================
                         EMPTY STATE (when cart has no items)
                         ======================================================== -->
                    <ui:fragment rendered="#{cartController.authenticated and (empty cartController.cartService.cartItems or cartController.itemCount == 0)}">
                        <ui:include src="/client/components/empty-state.xhtml">
                            <ui:param name="icon" value="ti ti-shopping-cart-off" />
                            <ui:param name="title" value="Your cart is empty." />
                            <ui:param name="subtitle" value="You haven't added any camera equipment or lenses to your rental cart yet. Browse our catalog to find gear for your next shoot." />
                            <ui:param name="actionUrl" value="#{request.contextPath}/faces/client/pages/devices.xhtml" />
                            <ui:param name="actionText" value="CONTINUE SHOPPING" />
                            <ui:param name="actionVariant" value="outline-dark" />
                            <ui:param name="actionSize" value="lg" />
                        </ui:include>
                    </ui:fragment>

                    <!-- ========================================================
                         ACTIVE STATE (when cart has 1 or more items)
                         ======================================================== -->
                    <ui:fragment rendered="#{cartController.authenticated and not empty cartController.cartService.cartItems and cartController.itemCount > 0}">
                        <div class="cart-grid-layout">

                            <!-- Left Column: Items List -->
                            <div class="cart-items-column">

                                <!-- Items Header Controls Bar with Select All -->
                                <div class="cart-items-header">
                                    <div class="cart-header-select-wrap">
                                        <h:commandLink action="#{cartController.toggleSelectAll}"
                                                       styleClass="cart-checkbox-wrap #{cartController.allSelected ? 'is-checked' : ''}"
                                                       title="#{cartController.allSelected ? 'Deselect all items' : 'Select all items'}">
                                            <span class="cart-custom-checkbox">
                                                <svg class="cart-check-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                                    <path d="M3.5 8.5L6.5 11.5L12.5 4.5" />
                                                </svg>
                                            </span>
                                            <span class="cart-select-all-label">
                                                Select All
                                                <span class="cart-select-count">(#{cartController.selectedCount}/#{cartController.itemCount})</span>
                                            </span>
                                            <f:ajax execute="@this" render="cartMainWrapper :headerCartWrapper" />
                                        </h:commandLink>
                                    </div>

                                    <h:commandLink action="#{cartController.clearCart}"
                                                   styleClass="cart-clear-link"
                                                   onclick="return confirm('Are you sure you want to remove all items from your cart?');">
                                        <span>Clear All</span>
                                        <f:ajax execute="@this" render="cartMainWrapper :headerCartWrapper" />
                                    </h:commandLink>
                                </div>

                                <!-- Hidden fields for AJAX date update -->
                                <h:inputHidden id="updateCartItemId" value="#{cartController.editCartItemId}" />
                                <h:inputHidden id="updateStartDate" value="#{cartController.editStartDate}" />
                                <h:inputHidden id="updateEndDate" value="#{cartController.editEndDate}" />
                                <h:commandButton id="btnSubmitUpdateDates" action="#{cartController.saveRentalPeriodUpdate}" styleClass="cart-hidden-submit">
                                    <f:ajax execute="@form" render="cartMainWrapper :headerCartWrapper" />
                                </h:commandButton>

                                <!-- Cart Items List (Available items pushed to top, expired/out-of-stock below) -->
                                <ui:repeat value="#{cartController.sortedCartItems}" var="item">
                                    <ui:include src="/client/components/rental-item-card.xhtml">
                                        <ui:param name="item" value="#{item}" />
                                        <ui:param name="readonly" value="false" />
                                    </ui:include>
                                </ui:repeat>

                                <div class="cart-bottom-nav">
                                    <ui:include src="/client/components/button.xhtml">
                                        <ui:param name="href" value="#{request.contextPath}/faces/client/pages/devices.xhtml" />
                                        <ui:param name="text" value="CONTINUE SHOPPING" />
                                        <ui:param name="variant" value="outline-dark" />
                                        <ui:param name="size" value="lg" />
                                    </ui:include>
                                </div>

                            </div>

                            <!-- Right Column: Order Summary Sidebar (Reusing rental-summary component) -->
                            <ui:include src="/client/components/rental-summary.xhtml" />

                        </div>
                    </ui:fragment>

                </h:panelGroup>

            </h:form>

        </main>
    </ui:define>

</ui:composition>
