<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:pt="jakarta.faces.passthrough"
                template="/WEB-INF/templates/admin-template.xhtml">

    <ui:param name="activeMenu" value="users" />

    <ui:define name="title">
        Users Management - Lens Camera Rental
    </ui:define>

    <ui:define name="head">
        <h:outputStylesheet library="admin" name="css/pages/user.css" />
    </ui:define>

    <ui:define name="content">
        <div class="main-wrapper">
            <h:form id="usersForm">
                <!-- Page Header -->
                <div class="page-header">
                    <div class="page-header-row">
                        <div>
                            <div class="page-pretitle">Overview</div>
                            <h1 class="page-title">Users Management</h1>
                        </div>
                        <div>
                            <h:commandButton value="+ Add User" action="#{adminUserController.newUser()}"
                                             styleClass="btn btn-primary" />
                        </div>
                    </div>
                </div>

                <!-- Top Statistics Section -->
                <h:panelGroup id="statsCardsWrapper" layout="block" styleClass="stats-grid">
                    <!-- Total Users -->
                    <div class="stat-card">
                        <span class="stat-label">Total Users</span>
                        <div class="stat-value">#{adminUserController.totalUsers}</div>
                    </div>

                    <!-- Active -->
                    <div class="stat-card">
                        <span class="stat-label">Active</span>
                        <div class="stat-value">#{adminUserController.totalActiveUsers}</div>
                    </div>

                    <!-- Inactive -->
                    <div class="stat-card">
                        <span class="stat-label">Inactive</span>
                        <div class="stat-value">#{adminUserController.totalInactiveUsers}</div>
                    </div>
                </h:panelGroup>

                <!-- Search & Filter Toolbar -->
                <h:panelGroup id="searchBar" layout="block" styleClass="users-search">
                    <h:inputText id="keyword" value="#{adminUserController.keyword}"
                                 pt:placeholder="Search username, name, email, phone..."
                                 styleClass="form-control search-input">
                        <f:ajax event="keyup" delay="300" render="usersTableWrapper" />
                    </h:inputText>

                    <!-- Role Filter -->
                    <h:selectOneMenu id="roleFilter" value="#{adminUserController.role}"
                                     styleClass="form-select filter-select-sm">
                        <f:selectItem itemLabel="All Roles" itemValue="" />
                        <f:selectItem itemLabel="Admin" itemValue="ADMIN" />
                        <f:selectItem itemLabel="Customer" itemValue="CUSTOMER" />
                        <f:ajax event="change" render="usersTableWrapper" />
                    </h:selectOneMenu>

                    <!-- Status Filter -->
                    <h:selectOneMenu id="statusFilter" value="#{adminUserController.status}"
                                     styleClass="form-select filter-select-sm">
                        <f:selectItem itemLabel="All Statuses" itemValue="" />
                        <f:selectItem itemLabel="Active" itemValue="ACTIVE" />
                        <f:selectItem itemLabel="Inactive" itemValue="INACTIVE" />
                        <f:ajax event="change" render="usersTableWrapper" />
                    </h:selectOneMenu>

                    <h:commandButton value="Search" action="list" styleClass="btn btn-primary">
                        <f:ajax execute="@form" render="usersTableWrapper" />
                    </h:commandButton>

                    <h:commandButton value="Reset" action="#{adminUserController.resetFilter()}"
                                     styleClass="btn btn-outline-secondary">
                        <f:ajax render="searchBar usersTableWrapper" />
                    </h:commandButton>
                </h:panelGroup>


                <!-- Users Table Card -->
                <div class="card">
                    <h:panelGroup id="usersTableWrapper" layout="block" styleClass="table-wrapper">
                        <h:dataTable id="usersTable" value="#{adminUserController.usersList}" var="user"
                                     styleClass="data-table">
                            <!-- ID -->
                            <h:column>
                                <f:facet name="header">ID</f:facet>
                                <h:outputText value="#{user.id}" />
                            </h:column>

                            <!-- Username -->
                            <h:column>
                                <f:facet name="header">Username</f:facet>
                                <code class="font-code">#{user.username}</code>
                            </h:column>

                            <!-- Full Name -->
                            <h:column>
                                <f:facet name="header">Full Name</f:facet>
                                <h:outputText value="#{user.fullName}" styleClass="fw-semibold" />
                            </h:column>

                            <!-- Email -->
                            <h:column>
                                <f:facet name="header">Email</f:facet>
                                <h:outputText value="#{user.email}" />
                            </h:column>

                            <!-- Phone -->
                            <h:column>
                                <f:facet name="header">Phone</f:facet>
                                <h:outputText value="#{user.phone}" />
                            </h:column>

                            <!-- Role -->
                            <h:column>
                                <f:facet name="header">Role</f:facet>
                                <span class="badge-role #{user.role == 'ADMIN' ? 'badge-admin' : 'badge-customer'}">
                                    <h:outputText value="#{user.role == 'ADMIN' ? 'Admin' : 'Customer'}" />
                                </span>
                            </h:column>

                            <!-- Status -->
                            <h:column>
                                <f:facet name="header">Status</f:facet>
                                <span class="badge-status #{user.status == 'ACTIVE' ? 'badge-active' : 'badge-inactive'}">
                                    <h:outputText value="#{user.status == 'ACTIVE' ? 'Active' : 'Inactive'}" />
                                </span>
                            </h:column>

                            <!-- Actions -->
                            <h:column>
                                <f:facet name="header">Action</f:facet>
                                <div class="table-row-actions">
                                    <h:commandButton value="Detail" action="#{adminUserController.detailUser(user.id)}"
                                                     styleClass="btn btn-sm btn-outline-info" />
                                    <h:commandButton value="Edit" action="#{adminUserController.editUser(user.id)}"
                                                     styleClass="btn btn-sm btn-outline-primary" />
                                    <h:commandButton value="Delete" action="#{adminUserController.deleteUser(user.id)}"
                                                     rendered="#{user.id ne adminUserController.currentUserId}"
                                                     onclick="if (!confirm('Are you sure you want to delete this user?')) return false;"
                                                     styleClass="btn btn-sm btn-outline-danger">
                                        <f:ajax render="usersTableWrapper statsCardsWrapper" />
                                    </h:commandButton>
                                    <h:panelGroup rendered="#{user.id eq adminUserController.currentUserId}">
                                        <span class="badge-role badge-admin" style="font-size: 0.75rem; padding: 4px 8px;">You</span>
                                    </h:panelGroup>
                                </div>
                            </h:column>
                        </h:dataTable>
                    </h:panelGroup>
                </div>
            </h:form>
        </div>
    </ui:define>
</ui:composition>
