<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:pt="jakarta.faces.passthrough"
                template="/WEB-INF/templates/admin-template.xhtml">

    <ui:param name="activeMenu" value="users" />

    <ui:define name="title">
        Users Management - Lens Camera Rental
    </ui:define>

    <ui:define name="content">
        <!-- Flash Alert Message (Create / Update notification) -->
        <h:panelGroup rendered="#{not empty flash.actionAlert}">
            <script type="text/javascript">
                alert('#{flash.actionAlert}');
            </script>
        </h:panelGroup>

        <script type="text/javascript">
            function onDeleteEvent(data) {
                if (data.status === 'success') {
                    alert('User deleted successfully.');
                    window.location.reload();
                }
            }
        </script>

        <div class="main-wrapper">
            <h:form id="usersForm">
                <!-- Page Header -->
                <div class="page-header">
                    <div class="page-header-row">
                        <div>
                            <div class="page-pretitle">Overview</div>
                            <h1 class="page-title">Users Management</h1>
                        </div>
                        <div>
                            <h:commandButton value="+ Add User" action="#{userController.newUser()}"
                                             styleClass="btn btn-primary" />
                        </div>
                    </div>
                </div>

                <!-- Top Statistics Section -->
                <h:panelGroup id="statsCardsWrapper" layout="block" styleClass="stats-grid">
                    <!-- Total Users -->
                    <div class="stat-card">
                        <span class="stat-label">Total Users</span>
                        <div class="stat-value">#{userController.totalUsers}</div>
                    </div>

                    <!-- Customers -->
                    <div class="stat-card">
                        <span class="stat-label">Customers</span>
                        <div class="stat-value">#{userController.totalCustomerRole}</div>
                    </div>

                    <!-- Admins -->
                    <div class="stat-card">
                        <span class="stat-label">Admins</span>
                        <div class="stat-value">#{userController.totalAdminRole}</div>
                    </div>
                </h:panelGroup>

                <!-- Search & Filter Toolbar -->
                <h:panelGroup id="searchBar" layout="block" styleClass="users-search">
                    <h:inputText id="keyword" value="#{userController.keyword}"
                                 pt:placeholder="Search username, name, email, phone..."
                                 styleClass="form-control search-input">
                        <f:ajax event="keyup" delay="300" render="usersTableWrapper" />
                    </h:inputText>

                    <h:commandButton value="Search" action="list" styleClass="btn btn-primary">
                        <f:ajax execute="@form" render="usersTableWrapper" />
                    </h:commandButton>

                    <!-- Role Filter -->
                    <h:selectOneMenu id="roleFilter" value="#{userController.role}"
                                     styleClass="form-select filter-select-sm">
                        <f:selectItem itemLabel="All Roles" itemValue="" />
                        <f:selectItem itemLabel="Admin" itemValue="ADMIN" />
                        <f:selectItem itemLabel="Customer" itemValue="CUSTOMER" />
                        <f:ajax event="change" render="usersTableWrapper" />
                    </h:selectOneMenu>

                    <h:commandButton value="Reset" action="#{userController.resetFilter()}"
                                     styleClass="btn btn-outline-secondary">
                        <f:ajax render="searchBar usersTableWrapper" />
                    </h:commandButton>
                </h:panelGroup>

                <!-- Users Table Card -->
                <div class="card">
                    <h:panelGroup id="usersTableWrapper" layout="block" styleClass="table-wrapper">
                        <h:dataTable id="usersTable" value="#{userController.usersList}" var="user"
                                     styleClass="data-table">
                            <!-- ID -->
                            <h:column>
                                <f:facet name="header">ID</f:facet>
                                <h:outputText value="#{user.id}" />
                            </h:column>

                            <!-- Username -->
                            <h:column>
                                <f:facet name="header">Username</f:facet>
                                <code class="font-code">#{user.username}</code>
                            </h:column>

                            <!-- Full Name -->
                            <h:column>
                                <f:facet name="header">Full Name</f:facet>
                                <h:outputText value="#{user.fullName}" styleClass="fw-semibold" />
                            </h:column>

                            <!-- Email -->
                            <h:column>
                                <f:facet name="header">Email</f:facet>
                                <h:outputText value="#{user.email}" />
                            </h:column>

                            <!-- Phone -->
                            <h:column>
                                <f:facet name="header">Phone</f:facet>
                                <h:outputText value="#{user.phone}" />
                            </h:column>

                            <!-- Role -->
                            <h:column>
                                <f:facet name="header">Role</f:facet>
                                <span class="badge-role #{user.role == 'ADMIN' ? 'badge-admin' : 'badge-customer'}">
                                    <h:outputText value="#{user.role == 'ADMIN' ? 'Admin' : 'Customer'}" />
                                </span>
                            </h:column>

                            <!-- Status -->
                            <h:column>
                                <f:facet name="header">Status</f:facet>
                                <span class="badge-status #{user.status == 'ACTIVE' ? 'badge-active' : 'badge-inactive'}">
                                    <h:outputText value="#{user.status == 'ACTIVE' ? 'Active' : 'Inactive'}" />
                                </span>
                            </h:column>

                            <!-- Actions -->
                            <h:column>
                                <f:facet name="header">Action</f:facet>
                                <div class="table-row-actions">
                                    <h:commandButton value="Detail" action="#{userController.detailUser(user.id)}"
                                                     styleClass="btn btn-sm btn-outline-info" />
                                    <h:commandButton value="Edit" action="#{userController.editUser(user.id)}"
                                                     styleClass="btn btn-sm btn-outline-primary" />
                                    <h:commandButton value="Delete" action="#{userController.deleteUser(user.id)}"
                                                     onclick="if (!confirm('Are you sure you want to delete this user?')) return false;"
                                                     styleClass="btn btn-sm btn-outline-danger">
                                        <f:ajax render="usersTableWrapper statsCardsWrapper" onevent="onDeleteEvent" />
                                    </h:commandButton>
                                </div>
                            </h:column>
                        </h:dataTable>
                    </h:panelGroup>
                </div>
            </h:form>
        </div>
    </ui:define>
</ui:composition>
