<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                template="/WEB-INF/templates/admin-template.xhtml">

    <f:metadata>
        <f:viewParam name="id" value="#{adminUserController.id}" />
        <f:viewAction action="#{adminUserController.initDetail()}" onPostback="false" />
    </f:metadata>

    <ui:param name="activeMenu" value="users" />

    <ui:define name="title">
        #{adminUserController.users.fullName} - User Details
    </ui:define>

    <ui:define name="head">
        <h:outputStylesheet library="admin" name="css/pages/detail.css" />
    </ui:define>

    <ui:define name="content">
        <div class="main-wrapper">
            <div class="detail-page-container">
                <h:form id="detailForm">
                    <!-- Page Header -->
                    <div class="detail-header">
                        <div class="detail-header-row">
                            <div>
                                <div class="detail-eyebrow">USERS</div>
                                <h1 class="detail-title">User Details</h1>
                            </div>
                            <div class="detail-actions">
                                <h:commandButton value="Back" action="list?faces-redirect=true" immediate="true"
                                                 styleClass="btn btn-outline-secondary" />
                                <h:commandButton value="Edit User"
                                                 action="#{adminUserController.editUser(adminUserController.users.id)}"
                                                 styleClass="btn btn-primary" />
                            </div>
                        </div>
                    </div>

                    <!-- 2-Column Detail Layout -->
                    <div class="detail-layout">
                        <!-- Main Column (Left) -->
                        <div class="detail-main">
                            <!-- Basic Information Card (Primary Identity) -->
                            <div class="detail-card">
                                <div class="detail-card-header">
                                    <h2 class="detail-card-title">Basic Information</h2>
                                </div>
                                <div class="detail-card-body">
                                    <div class="detail-identity-row">
                                        <div class="detail-avatar">
                                            <h:outputText value="#{adminUserController.users.fullName != null and adminUserController.users.fullName.length() > 0 ? adminUserController.users.fullName.substring(0, 1).toUpperCase() : 'U'}" />
                                        </div>

                                        <div class="detail-identity-content">
                                            <div class="detail-identity-field">
                                                <div class="detail-label">Full Name</div>
                                                <h3 class="detail-identity-title">
                                                    <h:outputText value="#{adminUserController.users.fullName}" />
                                                </h3>
                                            </div>
                                            <div class="detail-identity-meta-grid">
                                                <div class="detail-item">
                                                    <div class="detail-label">User ID</div>
                                                    <div class="detail-value detail-value-strong">
                                                        <h:outputText value="User ##{adminUserController.users.id}" />
                                                    </div>
                                                </div>
                                                <div class="detail-item">
                                                    <div class="detail-label">Username</div>
                                                    <div class="detail-value">
                                                        <h:outputText value="@#{adminUserController.users.username}" />
                                                    </div>
                                                </div>
                                                <div class="detail-item">
                                                    <div class="detail-label">Role</div>
                                                    <div>
                                                        <span class="badge-role #{adminUserController.users.role == 'ADMIN' ? 'badge-admin' : 'badge-customer'}">
                                                            <h:outputText value="#{adminUserController.users.role == 'ADMIN' ? 'Admin' : 'Customer'}" />
                                                        </span>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Account & Contact Details Card -->
                            <div class="detail-card">
                                <div class="detail-card-header">
                                    <h2 class="detail-card-title">Account &amp; Contact Details</h2>
                                </div>
                                <div class="detail-card-body">
                                    <div class="detail-grid-3">
                                        <div class="detail-item">
                                            <div class="detail-label">Username</div>
                                            <div class="detail-value">
                                                <h:outputText value="#{adminUserController.users.username}" />
                                            </div>
                                        </div>
                                        <div class="detail-item">
                                            <div class="detail-label">Email Address</div>
                                            <div class="detail-value #{empty adminUserController.users.email ? 'detail-empty' : ''}">
                                                <h:outputText value="#{not empty adminUserController.users.email ? adminUserController.users.email : 'None provided'}" />
                                            </div>
                                        </div>
                                        <div class="detail-item">
                                            <div class="detail-label">Phone Number</div>
                                            <div class="detail-value">
                                                <h:outputText value="#{adminUserController.users.phone}" />
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Sidebar Column (Right) -->
                        <div class="detail-sidebar">
                            <!-- Status Card -->
                            <div class="detail-card">
                                <div class="detail-card-header detail-status-card-header">
                                    <h2 class="detail-card-title">Status</h2>
                                    <span class="badge-status #{adminUserController.users.status == 'ACTIVE' ? 'badge-active' : 'badge-inactive'}">
                                        <h:outputText value="#{adminUserController.users.status == 'ACTIVE' ? 'Active' : 'Inactive'}" />
                                    </span>
                                </div>
                            </div>

                            <!-- System Information Card -->
                            <div class="detail-card">
                                <div class="detail-card-header">
                                    <h2 class="detail-card-title">System Information</h2>
                                </div>
                                <div class="detail-card-body">
                                    <div class="detail-meta-list">
                                        <div class="detail-meta-row">
                                            <span class="detail-meta-label">Created At</span>
                                            <span class="detail-meta-value">
                                                <h:outputText value="#{adminUserController.users.createdAt}">
                                                    <f:convertDateTime pattern="dd/MM/yyyy HH:mm" timeZone="Asia/Ho_Chi_Minh" />
                                                </h:outputText>
                                            </span>
                                        </div>
                                        <div class="detail-meta-row">
                                            <span class="detail-meta-label">Updated At</span>
                                            <span class="detail-meta-value">
                                                <h:outputText value="#{adminUserController.users.updatedAt}">
                                                    <f:convertDateTime pattern="dd/MM/yyyy HH:mm" timeZone="Asia/Ho_Chi_Minh" />
                                                </h:outputText>
                                            </span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </h:form>
            </div>
        </div>
    </ui:define>
</ui:composition>
