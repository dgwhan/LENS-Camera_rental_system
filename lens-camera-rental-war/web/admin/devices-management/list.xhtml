<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core"
    xmlns:ui="jakarta.faces.facelets" xmlns:pt="jakarta.faces.passthrough" template="/WEB-INF/templates/admin-template.xhtml">

    <ui:param name="activeMenu" value="devices" />

    <ui:define name="title">
        Devices Management - Lens Camera Rental
    </ui:define>

    <ui:define name="content">
        <div class="main-wrapper">
            <h:form id="devicesForm">
                <div class="page-header">
                    <div class="page-header-row">
                        <div>
                            <div class="page-pretitle">Overview</div>
                            <h1 class="page-title">Devices Management</h1>
                        </div>
                        <div>
                            <h:commandButton value="+ Add Device" action="#{adminDeviceController.newDevice()}"
                                styleClass="btn btn-primary" />
                        </div>
                    </div>
                </div>

                <!-- Top Statistics Section -->
                <h:panelGroup id="statsCardsWrapper" layout="block" styleClass="stats-grid">
                    <!-- Total Devices -->
                    <div class="stat-card">
                        <span class="stat-label">Total Devices</span>
                        <div class="stat-value">#{adminDeviceController.totalDevices}</div>
                    </div>

                    <!-- Available -->
                    <div class="stat-card">
                        <span class="stat-label">Available</span>
                        <div class="stat-value">#{adminDeviceController.totalDevicesAvailable}</div>
                    </div>

                    <!-- Renting -->
                    <div class="stat-card">
                        <span class="stat-label">Renting</span>
                        <div class="stat-value">#{adminDeviceController.totalDevicesRenting}</div>
                    </div>
                </h:panelGroup>

                <h:panelGroup id="searchBar" layout="block" styleClass="users-search">
                    <h:inputText id="keyword" value="#{adminDeviceController.keyword}"
                        pt:placeholder="Search serial number, brand, model..." styleClass="form-control search-input">
                        <f:ajax event="keyup" delay="300" render="devicesTableWrapper" />
                    </h:inputText>

                    <h:selectOneMenu id="statusFilter" value="#{adminDeviceController.status}"
                        styleClass="form-select filter-select-sm">
                        <f:selectItem itemLabel="All Statuses" itemValue="" />
                        <f:selectItem itemLabel="Available" itemValue="AVAILABLE" />
                        <f:selectItem itemLabel="Renting" itemValue="RENTING" />
                        <f:ajax event="change" render="devicesTableWrapper" />
                    </h:selectOneMenu>

                    <h:commandButton value="Search" action="list" styleClass="btn btn-primary">
                        <f:ajax execute="@form" render="devicesTableWrapper" />
                    </h:commandButton>

                    <h:commandButton value="Reset" action="#{adminDeviceController.resetFilter()}"
                        styleClass="btn btn-outline-secondary">
                        <f:ajax render="searchBar devicesTableWrapper" />
                    </h:commandButton>
                </h:panelGroup>


                <div class="card">
                    <h:panelGroup id="devicesTableWrapper" layout="block" styleClass="table-wrapper">
                        <h:dataTable id="devicesTable" value="#{adminDeviceController.devicesList}" var="device"
                            styleClass="data-table">

                            <!-- ID -->
                            <h:column>
                                <f:facet name="header">ID</f:facet>
                                <h:outputText value="#{device.id}" />
                            </h:column>

                            <!-- Serial Number -->
                            <h:column>
                                <f:facet name="header">Serial Number</f:facet>
                                <code class="font-code">#{device.serialNumber}</code>
                            </h:column>

                            <!-- Device Model -->
                            <h:column>
                                <f:facet name="header">Device Model</f:facet>
                                <h:outputText value="#{device.deviceModelId.brand} - #{device.deviceModelId.name}"
                                    styleClass="fw-semibold" />
                            </h:column>

                            <!-- Status -->
                            <h:column>
                                <f:facet name="header">Status</f:facet>
                                <span
                                    class="badge-status #{device.status == 'AVAILABLE' ? 'badge-available' : 'badge-renting'}">
                                    <h:outputText value="#{device.status == 'AVAILABLE' ? 'Available' : 'Renting'}" />
                                </span>
                            </h:column>

                            <!-- Thao tÃƒÂ¡c (Action) -->
                            <h:column>
                                <f:facet name="header">Action</f:facet>
                                <div class="table-row-actions">
                                    <h:commandButton value="Detail" action="#{adminDeviceController.detailDevice(device.id)}"
                                        styleClass="btn btn-sm btn-outline-info" />

                                    <h:commandButton value="Edit" action="#{adminDeviceController.editDevice(device.id)}"
                                        styleClass="btn btn-sm btn-outline-primary" />

                                    <h:commandButton value="Delete" action="#{adminDeviceController.deleteDevice(device.id)}"
                                        onclick="if (!confirm('Are you sure you want to delete this device?')) return false;"
                                        styleClass="btn btn-sm btn-outline-danger">
                                        <f:ajax render="devicesTableWrapper statsCardsWrapper" />
                                    </h:commandButton>
                                </div>
                            </h:column>

                        </h:dataTable>
                    </h:panelGroup>
                </div>
            </h:form>
        </div>
    </ui:define>
</ui:composition>
