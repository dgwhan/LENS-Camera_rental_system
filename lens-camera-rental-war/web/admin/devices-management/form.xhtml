<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:pt="jakarta.faces.passthrough"
                template="/WEB-INF/templates/admin-template.xhtml">


    <f:metadata>
        <f:viewParam name="id" value="#{deviceController.id}" />
        <f:viewAction action="#{deviceController.initForm()}" onPostback="false" />
    </f:metadata>

    <ui:param name="activeMenu" value="devices" />



    <ui:define name="title">
        #{deviceController.editMode ? 'Edit Device' : 'Create Device'} - Lens Camera Rental
    </ui:define>

    <ui:define name="scripts">
        <h:outputScript library="js" name="selector.js" target="body" />
    </ui:define>

    <ui:define name="content">
        <!-- ThÃ´ng bÃ¡o lá»—i khi thao tÃ¡c tháº¥t báº¡i -->
        <h:panelGroup
            rendered="#{not empty facesContext.messageList and (facesContext.messageList[0].summary eq 'Failed to create device.' or facesContext.messageList[0].summary eq 'Failed to update device.')}">
            <script type="text/javascript">
                alert('#{facesContext.messageList[0].summary}');
            </script>
        </h:panelGroup>

        <div class="main-wrapper">
            <div class="form-container">
                <h:form id="deviceForm">
                    <!-- TiÃªu Ä‘á» trang -->
                    <div class="page-header">
                        <div class="page-header-row">
                            <div>
                                <div class="page-pretitle">Devices Management</div>
                                <h1 class="page-title">#{deviceController.editMode ? 'Edit Device' : 'Create New Device'}</h1>
                            </div>
                            <div>
                                <h:commandButton value="Back to Devices" action="list" immediate="true"
                                    styleClass="btn btn-outline-secondary" />
                            </div>
                        </div>
                    </div>

                    <!-- Tháº» Form thÃ´ng tin thiáº¿t bá»‹ -->
                    <div class="card">
                        <div class="card-header">
                            <div>
                                <h2 class="card-title">#{deviceController.editMode ? 'Edit Device Information' : 'Device Information'}</h2>
                            </div>
                        </div>

                        <div class="card-body">
                            <div class="form-grid">
                                <!-- Model thiáº¿t bá»‹ -->
                                <div class="form-group" style="grid-column: 1 / -1;">
                                    <h:outputLabel for="deviceModel" styleClass="form-label">
                                        Device Model <span class="form-required">*</span>
                                    </h:outputLabel>

                                    <div class="model-selector" data-selector="device-model">

                                        <h:selectOneMenu id="deviceModel" value="#{deviceController.selectedDeviceModelId}"
                                            required="true" requiredMessage="Please select a device model."
                                            styleClass="model-selector-native">

                                            <f:selectItem itemLabel="Select Device Model" itemValue=""
                                                noSelectionOption="true" />

                                            <f:selectItems value="#{deviceController.allDeviceModels}" var="dm"
                                                itemValue="#{dm.id}" itemLabel="#{dm.name} (#{dm.model})"
                                                itemDescription="#{dm.brand}" />
                                        </h:selectOneMenu>

                                        <!-- Dá»¯ liá»‡u brand áº©n Ä‘á»ƒ JavaScript tÃ¬m kiáº¿m nhanh -->
                                        <ui:repeat value="#{deviceController.allDeviceModels}" var="dm">
                                            <span class="model-meta-data" data-id="#{dm.id}" data-brand="#{dm.brand}"
                                                style="display:none;"></span>
                                        </ui:repeat>

                                        <!-- Nháº­p tÃ¬m kiáº¿m trá»±c tiáº¿p + NÃºt mÅ©i tÃªn má»Ÿ danh sÃ¡ch -->
                                        <div class="model-combobox">
                                            <input type="text" class="model-combobox-input"
                                                placeholder="Select or search device model" autocomplete="off" />
                                            <button type="button" class="model-combobox-chevron" tabindex="-1"
                                                aria-label="Toggle dropdown"></button>
                                        </div>

                                        <!-- Menu dropdown: Hiá»ƒn thá»‹ toÃ n bá»™ danh sÃ¡ch, lá»c tá»©c thÃ¬ khi gÃµ -->
                                        <div class="model-selector-dropdown">
                                            <div class="model-selector-results" role="listbox">
                                            </div>
                                        </div>
                                    </div>

                                    <h:message for="deviceModel" styleClass="field-error" />
                                </div>

                                <!-- MÃ£ sá»‘ Serial thiáº¿t bá»‹ -->
                                <div class="form-group" style="grid-column: 1 / -1;">
                                    <h:outputLabel for="serialNumber" styleClass="form-label">
                                        Serial Number <span class="form-required">*</span>
                                    </h:outputLabel>
                                    <h:inputText id="serialNumber" value="#{deviceController.devices.serialNumber}" required="true"
                                        requiredMessage="Serial number is required." pt:placeholder="e.g. SN-SONY-00123"
                                        styleClass="form-control" />
                                    <h:message for="serialNumber" styleClass="field-error" />
                                </div>
                            </div>
                        </div>

                        <!-- NÃºt thao tÃ¡c dÆ°á»›i chÃ¢n tháº» -->
                        <div class="card-footer">
                            <h:commandButton value="Cancel" action="list?faces-redirect=true" immediate="true"
                                styleClass="btn btn-outline-secondary" />

                            <div>
                                <h:commandButton value="Save Changes" action="#{deviceController.updateDevice()}"
                                    rendered="#{deviceController.editMode}" styleClass="btn btn-primary" />
                                <h:commandButton value="Create Device" action="#{deviceController.insertDevice()}"
                                    rendered="#{not deviceController.editMode}" styleClass="btn btn-primary" />
                            </div>
                        </div>
                    </div>
                </h:form>
            </div>
        </div>
    </ui:define>
</ui:composition>
