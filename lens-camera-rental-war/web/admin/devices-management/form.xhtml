<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:pt="jakarta.faces.passthrough"
                template="/WEB-INF/templates/admin-template.xhtml">


    <f:metadata>
        <f:viewParam name="id" value="#{adminDeviceController.id}" />
        <f:viewAction action="#{adminDeviceController.initForm()}" onPostback="false" />
    </f:metadata>

    <ui:param name="activeMenu" value="devices" />



    <ui:define name="title">
        #{adminDeviceController.editMode ? 'Edit Device' : 'Create Device'} - Lens Camera Rental
    </ui:define>

    <ui:define name="scripts">
        <h:outputScript library="js" name="admin/selector.js" target="body" />
    </ui:define>

    <ui:define name="content">


        <div class="main-wrapper">
            <div class="form-container">
                <h:form id="deviceForm">
                    <!-- TiÃƒÂªu Ã„â€˜Ã¡Â»Â trang -->
                    <div class="page-header">
                        <div class="page-header-row">
                            <div>
                                <div class="page-pretitle">Devices Management</div>
                                <h1 class="page-title">#{adminDeviceController.editMode ? 'Edit Device' : 'Create New Device'}</h1>
                            </div>
                            <div>
                                <h:commandButton value="Back to Devices" action="list" immediate="true"
                                    styleClass="btn btn-outline-secondary" />
                            </div>
                        </div>
                    </div>

                    <!-- ThÃ¡ÂºÂ» Form thÃƒÂ´ng tin thiÃ¡ÂºÂ¿t bÃ¡Â»â€¹ -->
                    <div class="card">
                        <div class="card-header">
                            <div>
                                <h2 class="card-title">#{adminDeviceController.editMode ? 'Edit Device Information' : 'Device Information'}</h2>
                            </div>
                        </div>

                        <div class="card-body">
                            <div class="form-grid">
                                <!-- Model thiÃ¡ÂºÂ¿t bÃ¡Â»â€¹ -->
                                <div class="form-group" style="grid-column: 1 / -1;">
                                    <h:outputLabel for="deviceModel" styleClass="form-label">
                                        Device Model <span class="form-required">*</span>
                                    </h:outputLabel>

                                    <div class="model-selector" data-selector="device-model">

                                        <h:selectOneMenu id="deviceModel" value="#{adminDeviceController.selectedDeviceModelId}"
                                            required="true" requiredMessage="Please select a device model."
                                            styleClass="model-selector-native">

                                            <f:selectItem itemLabel="Select Device Model" itemValue=""
                                                noSelectionOption="true" />

                                            <f:selectItems value="#{adminDeviceController.allDeviceModels}" var="dm"
                                                itemValue="#{dm.id}" itemLabel="#{dm.name} (#{dm.model})"
                                                itemDescription="#{dm.brand}" />
                                        </h:selectOneMenu>

                                        <!-- DÃ¡Â»Â¯ liÃ¡Â»â€¡u brand Ã¡ÂºÂ©n Ã„â€˜Ã¡Â»Æ’ JavaScript tÃƒÂ¬m kiÃ¡ÂºÂ¿m nhanh -->
                                        <ui:repeat value="#{adminDeviceController.allDeviceModels}" var="dm">
                                            <span class="model-meta-data" data-id="#{dm.id}" data-brand="#{dm.brand}"
                                                style="display:none;"></span>
                                        </ui:repeat>

                                        <!-- NhÃ¡ÂºÂ­p tÃƒÂ¬m kiÃ¡ÂºÂ¿m trÃ¡Â»Â±c tiÃ¡ÂºÂ¿p + NÃƒÂºt mÃ…Â©i tÃƒÂªn mÃ¡Â»Å¸ danh sÃƒÂ¡ch -->
                                        <div class="model-combobox">
                                            <input type="text" class="model-combobox-input"
                                                placeholder="Select or search device model" autocomplete="off" />
                                            <button type="button" class="model-combobox-chevron" tabindex="-1"
                                                aria-label="Toggle dropdown"></button>
                                        </div>

                                        <!-- Menu dropdown: HiÃ¡Â»Æ’n thÃ¡Â»â€¹ toÃƒÂ n bÃ¡Â»â„¢ danh sÃƒÂ¡ch, lÃ¡Â»Âc tÃ¡Â»Â©c thÃƒÂ¬ khi gÃƒÂµ -->
                                        <div class="model-selector-dropdown">
                                            <div class="model-selector-results" role="listbox">
                                            </div>
                                        </div>
                                    </div>

                                    <h:message for="deviceModel" styleClass="field-error" />
                                </div>

                                <!-- MÃƒÂ£ sÃ¡Â»â€˜ Serial thiÃ¡ÂºÂ¿t bÃ¡Â»â€¹ -->
                                <div class="form-group" style="grid-column: 1 / -1;">
                                    <h:outputLabel for="serialNumber" styleClass="form-label">
                                        Serial Number <span class="form-required">*</span>
                                    </h:outputLabel>
                                    <h:inputText id="serialNumber" value="#{adminDeviceController.devices.serialNumber}" required="true"
                                        requiredMessage="Serial number is required." pt:placeholder="e.g. SN-SONY-00123"
                                        styleClass="form-control" />
                                    <h:message for="serialNumber" styleClass="field-error" />
                                </div>
                            </div>
                        </div>

                        <!-- NÃƒÂºt thao tÃƒÂ¡c dÃ†Â°Ã¡Â»â€ºi chÃƒÂ¢n thÃ¡ÂºÂ» -->
                        <div class="card-footer">
                            <h:commandButton value="Cancel" action="list?faces-redirect=true" immediate="true"
                                styleClass="btn btn-outline-secondary" />

                            <div>
                                <h:commandButton value="Save Changes" action="#{adminDeviceController.updateDevice()}"
                                    rendered="#{adminDeviceController.editMode}" styleClass="btn btn-primary" />
                                <h:commandButton value="Create Device" action="#{adminDeviceController.insertDevice()}"
                                    rendered="#{not adminDeviceController.editMode}" styleClass="btn btn-primary" />
                            </div>
                        </div>
                    </div>
                </h:form>
            </div>
        </div>
    </ui:define>
</ui:composition>
