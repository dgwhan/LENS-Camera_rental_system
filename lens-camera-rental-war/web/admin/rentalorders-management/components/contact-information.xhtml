<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="jakarta.faces.html"
    xmlns:ui="jakarta.faces.facelets">

    <h:outputStylesheet
        library="admin"
        name="css/pages/detail.css" />

    <h:outputStylesheet
        library="admin"
        name="css/components/contact-information.css" />

    <div class="detail-card contact-card">

        <div class="detail-card-header">
            <h2 class="detail-card-title">
                Contact Information
            </h2>
        </div>

        <div class="detail-card-body">

            <div class="contact-grid">

                <div class="contact-item">
                    <span class="detail-label">
                        Customer
                    </span>

                    <span class="detail-value detail-value-strong">
                        #{adminRentalOrderController.selectedOrder.userId.fullName}
                    </span>
                </div>

                <div class="contact-item">
                    <span class="detail-label">
                        Phone
                    </span>

                    <span class="detail-value">
                        #{adminRentalOrderController.selectedOrder.customerPhone}
                    </span>
                </div>

                <div class="contact-item">
                    <span class="detail-label">
                        Email
                    </span>

                    <span class="detail-value">
                        #{adminRentalOrderController.selectedOrder.userId.email}
                    </span>
                </div>

            </div>

        </div>

    </div>

</ui:composition>
