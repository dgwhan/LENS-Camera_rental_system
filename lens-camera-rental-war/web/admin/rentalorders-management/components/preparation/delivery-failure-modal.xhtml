<?xml version="1.0" encoding="UTF-8"?>
<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="jakarta.faces.html"
    xmlns:f="jakarta.faces.core"
    xmlns:ui="jakarta.faces.facelets"
    xmlns:pt="jakarta.faces.passthrough">

    <h:panelGroup
        id="deliveryFailureModal"
        layout="block"
        styleClass="preparation-modal-overlay">

        <div class="preparation-modal-dialog">

            <div class="preparation-modal-header">

                <div>

                    <div class="preparation-modal-title">
                        Failed Delivery
                    </div>

                    <div class="preparation-modal-subtitle">
                        Please provide a reason why the delivery failed.
                    </div>

                </div>

                <button
                    type="button"
                    class="preparation-modal-close"
                    onclick="closeDeliveryFailureModal();">
                    ×
                </button>

            </div>

            <div class="preparation-modal-body">

                <h:outputLabel
                    for="deliveryFailureReason"
                    value="Failure Reason"
                    styleClass="preparation-modal-label" />

                <h:inputTextarea
                    id="deliveryFailureReason"
                    value="#{adminRentalHandoverController.failureReason}"
                    rows="4"
                    required="true"
                    requiredMessage="Failure reason is required."
                    styleClass="form-control preparation-modal-textarea"
                    pt:maxlength="1000"
                    pt:placeholder="Enter the reason for the failed delivery..." />

                <h:message
                    id="deliveryFailureMessage"
                    for="deliveryFailureReason"
                    styleClass="form-error" />

            </div>

            <div class="preparation-modal-footer">

                <h:commandButton
                    value="Keep Delivery"
                    type="button"
                    styleClass="btn btn-outline-secondary"
                    onclick="closeDeliveryFailureModal();" />

                <h:commandButton
                    value="Confirm Failure"
                    action="#{adminRentalHandoverController.failDelivery(
                        adminRentalOrderController.selectedOrder.id,
                        adminRentalHandoverController.failureReason)}"
                    styleClass="btn btn-danger">

                    <f:ajax
                        execute="@this deliveryFailureReason"
                        render="deliveryFailureMessage" />

                </h:commandButton>

            </div>

        </div>

    </h:panelGroup>

</ui:composition>
