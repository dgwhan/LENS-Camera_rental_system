<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets">
    <ui:composition>
        <aside class="app-sidebar">
            <div class="sidebar-header">
                <h:link outcome="/admin/dashboard" styleClass="sidebar-brand-link">
                    <span class="sidebar-brand-title">LENS SYSTEM MANAGEMENT</span>
                </h:link>
            </div>

            <div class="sidebar-body">
                <div class="sidebar-section">
                    <div class="sidebar-section-title">General</div>
                    <ul class="sidebar-nav">
                        <li class="sidebar-nav-item">
                            <h:link outcome="/admin/dashboard"
                                    styleClass="sidebar-nav-link #{activeMenu eq 'overview' or facesContext.viewRoot.viewId.contains('dashboard') ? 'active' : ''}">
                                <span>Overview</span>
                            </h:link>
                        </li>
                    </ul>
                </div>

                <div class="sidebar-section">
                    <div class="sidebar-section-title">Management</div>
                    <ul class="sidebar-nav">
                        <li class="sidebar-nav-item">
                            <h:link outcome="/admin/users-management/list"
                                    styleClass="sidebar-nav-link #{activeMenu eq 'users' or facesContext.viewRoot.viewId.contains('users-management') ? 'active' : ''}">
                                <span>Users Management</span>
                            </h:link>
                        </li>

                        <li class="sidebar-nav-item">
                            <h:link outcome="/admin/devicemodels-management/list"
                                    styleClass="sidebar-nav-link #{activeMenu eq 'models' or facesContext.viewRoot.viewId.contains('devicemodels-management') ? 'active' : ''}">
                                <span>Device Models</span>
                            </h:link>
                        </li>

                        <li class="sidebar-nav-item">
                            <h:link outcome="/admin/devices-management/list"
                                    styleClass="sidebar-nav-link #{activeMenu eq 'devices' or facesContext.viewRoot.viewId.contains('devices-management') ? 'active' : ''}">
                                <span>Devices</span>
                            </h:link>
                        </li>
                    </ul>
                </div>
            </div>

            <!-- Footer: Logout Button -->
            <div class="sidebar-footer">
                <h:form id="sidebarLogoutForm" styleClass="sidebar-logout-form">
                    <h:commandLink action="#{authController.logout}" 
                                   styleClass="sidebar-logout-btn">
                        <span>Logout</span>
                    </h:commandLink>
                </h:form>
            </div>
        </aside>
    </ui:composition>
</html>
