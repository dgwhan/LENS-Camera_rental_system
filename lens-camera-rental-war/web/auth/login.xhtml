<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:pt="jakarta.faces.passthrough"
                xmlns:ui="jakarta.faces.facelets"
                template="/WEB-INF/templates/client-template.xhtml">

    <ui:param name="bodyClass" value="auth-page" />

    <ui:define name="title">Sign In - Lens Camera Rental</ui:define>

    <ui:define name="head">
        <h:outputStylesheet library="auth" name="css/auth.css" />
        <h:outputScript library="js" name="common/auth-ui.js" target="body" />
    </ui:define>

    <!-- Suppress header and footer for standalone auth page -->
    <ui:define name="header" />
    <ui:define name="footer" />

    <ui:define name="content">
        <div class="auth-container">

            <!-- Login Card -->
            <div class="auth-card">
                <div class="auth-card-header">
                    <nav class="auth-tabs" aria-label="Authentication">
                        <h:link outcome="/auth/login" value="Sign In" styleClass="auth-tab is-active" pt:aria-current="page" />
                        <h:link outcome="/auth/register" value="Create Account" styleClass="auth-tab" />
                    </nav>
                    <h2 class="auth-card-title">Sign In</h2>
                </div>

                <div class="auth-card-body">


                    <!-- Login Form -->
                    <h:form id="loginForm" styleClass="auth-form">
                        <div class="auth-form-group">
                            <h:outputLabel for="username" value="Username" styleClass="auth-label">
                                <span class="auth-required">*</span>
                            </h:outputLabel>
                            <h:inputText id="username" 
                                         value="#{loginController.username}" 
                                         required="true"
                                         requiredMessage="Please enter your username"
                                         styleClass="auth-input" 
                                         autocomplete="username" 
                                         pt:placeholder="Enter your username" />
                            <h:message for="username" styleClass="field-error" />
                        </div>

                        <div class="auth-form-group">
                            <h:outputLabel for="password" value="Password" styleClass="auth-label">
                                <span class="auth-required">*</span>
                            </h:outputLabel>
                            <div class="auth-password-wrap">
                                <h:inputSecret id="password" 
                                               value="#{loginController.password}" 
                                               required="true"
                                               requiredMessage="Please enter your password"
                                               styleClass="auth-input" 
                                               autocomplete="current-password" 
                                               pt:placeholder="Enter your password" />
                                <button type="button" class="auth-password-toggle" data-password-toggle="loginForm:password" aria-label="Show password" aria-pressed="false">
                                    <svg class="auth-eye-icon auth-eye-show" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
                                    <svg class="auth-eye-icon auth-eye-hide" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a15.7 15.7 0 0 1-3.2 3.9M6.2 6.2C3.5 8.1 2 12 2 12s3.6 7 10 7a10.5 10.5 0 0 0 4-.8"/></svg>
                                </button>
                            </div>
                            <h:message for="password" styleClass="field-error" />
                        </div>

                        <div class="auth-form-group auth-form-actions">
                            <h:commandButton value="Sign In" 
                                             action="#{loginController.login}" 
                                             styleClass="btn-auth" />
                        </div>
                    </h:form>
                </div>

                <div class="auth-card-footer">
                    <span>Don't have an account?</span>
                    <h:link outcome="/auth/register" value="Create an account" styleClass="auth-link" />
                </div>

            </div>

        </div>
    </ui:define>

</ui:composition>
